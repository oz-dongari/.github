<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Smoking health analysis workflow</title>
  <desc id="desc">Five-step analysis workflow from the 7,000-row health screening dataset through preparation, exploration, group comparison, correlation review, and interpretation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset="0.52" stop-color="#FAF7FF"/>
      <stop offset="1" stop-color="#FFF9F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="line" x1="160" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EC8F2"/>
      <stop offset="0.25" stop-color="#F4B45E"/>
      <stop offset="0.50" stop-color="#69C892"/>
      <stop offset="0.75" stop-color="#9A83E8"/>
      <stop offset="1" stop-color="#F08AA8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>

  <g opacity="0.58" fill="none" stroke-linecap="round">
    <path d="M90 92 q22 -32 44 0 q-22 28 -44 0" stroke="#B9E4F7" stroke-width="8"/>
    <path d="M1472 80 q24 -30 48 0 q-24 30 -48 0" stroke="#F6BDD0" stroke-width="8"/>
    <path d="M128 536 c20 -28 42 -28 62 0 c-20 22 -42 22 -62 0z" stroke="#D7C5F4" stroke-width="7"/>
    <path d="M1422 515 c18 -25 38 -25 57 0 c-18 21 -38 21 -57 0z" stroke="#CBE8D2" stroke-width="7"/>
  </g>

  <text x="72" y="82" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">ANALYSIS WORKFLOW</text>
  <text x="72" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#64748B">건강검진 데이터에서 흡연 관련 패턴을 읽어내는 실제 분석 흐름</text>

  <path d="M176 342 H1422" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
  <path d="M176 342 H1422" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.72"/>

  <circle r="8" fill="#111827">
    <animateMotion dur="7.8s" repeatCount="indefinite" path="M176 342 H1422"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="7.8s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <!-- DATA -->
    <g transform="translate(74 180)">
      <rect width="250" height="324" rx="28" fill="#DFF4FF" stroke="#B8E5F8" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#66C6F0"/>
      <text x="42" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">1</text>
      <text x="28" y="94" font-size="28" font-weight="800" fill="#164B61">DATA</text>
      <text x="28" y="125" font-size="16" font-weight="700" fill="#326276">7,000 rows · 18 columns</text>

      <g transform="translate(28 154)" fill="#FFFFFF" opacity="0.90">
        <rect x="0" y="0" width="194" height="91" rx="18"/>
        <rect x="18" y="19" width="92" height="8" rx="4" fill="#7FCDEC"/>
        <rect x="18" y="38" width="146" height="7" rx="3.5" fill="#A8DBEF"/>
        <rect x="18" y="56" width="132" height="7" rx="3.5" fill="#A8DBEF"/>
        <rect x="18" y="73" width="115" height="7" rx="3.5" fill="#A8DBEF"/>
      </g>

      <text x="28" y="278" font-size="15" fill="#416B7C">BMI · 혈압 · 중성지방</text>
      <text x="28" y="302" font-size="15" fill="#416B7C">충치 · 공복혈당 · 지질 지표</text>
    </g>

    <!-- PREPARE -->
    <g transform="translate(374 180)">
      <rect width="250" height="324" rx="28" fill="#FFF0D8" stroke="#F8D7A6" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#F2B35D"/>
      <text x="42" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">2</text>
      <text x="28" y="94" font-size="28" font-weight="800" fill="#704B1E">PREPARE</text>
      <text x="28" y="125" font-size="16" font-weight="700" fill="#87653E">결측 처리 + 파생변수</text>

      <g transform="translate(28 158)">
        <rect width="194" height="34" rx="17" fill="#FFF8EE"/>
        <text x="16" y="23" font-size="14" font-weight="700" fill="#795327">BMI 구간 생성</text>
        <rect y="48" width="194" height="34" rx="17" fill="#FFF8EE"/>
        <text x="16" y="71" font-size="14" font-weight="700" fill="#795327">연령대 구간 생성</text>
        <rect y="96" width="194" height="34" rx="17" fill="#FFF8EE"/>
        <text x="16" y="119" font-size="14" font-weight="700" fill="#795327">140개 결측값 처리</text>
      </g>

      <text x="28" y="302" font-size="15" fill="#8A6940">중앙값 · 최빈값 · 그룹 평균</text>
    </g>

    <!-- EXPLORE -->
    <g transform="translate(674 180)">
      <rect width="250" height="324" rx="28" fill="#E5F8EE" stroke="#CBECD9" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#5DC88C"/>
      <text x="42" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">3</text>
      <text x="28" y="94" font-size="28" font-weight="800" fill="#245B40">EXPLORE</text>
      <text x="28" y="125" font-size="16" font-weight="700" fill="#467258">분포와 집단 차이 확인</text>

      <g transform="translate(29 154)">
        <rect width="192" height="112" rx="18" fill="#F7FFFA"/>
        <line x1="18" y1="88" x2="174" y2="88" stroke="#B9DCC7" stroke-width="2"/>
        <rect x="29" y="50" width="24" height="38" rx="6" fill="#A8DDBA"/>
        <rect x="68" y="34" width="24" height="54" rx="6" fill="#7FCF9D"/>
        <rect x="107" y="19" width="24" height="69" rx="6" fill="#5EC88C"/>
        <rect x="146" y="42" width="24" height="46" rx="6" fill="#8FD5AA"/>
      </g>

      <text x="28" y="286" font-size="15" fill="#4B785D">단변량 · 이변량 · boxplot</text>
      <text x="28" y="308" font-size="15" fill="#4B785D">연속형 · 범주형 시각화</text>
    </g>

    <!-- COMPARE -->
    <g transform="translate(974 180)">
      <rect width="250" height="324" rx="28" fill="#EEE8FF" stroke="#DDD2FA" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#9580E4"/>
      <text x="42" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">4</text>
      <text x="28" y="94" font-size="28" font-weight="800" fill="#58448F">COMPARE</text>
      <text x="28" y="125" font-size="16" font-weight="700" fill="#6B5D9B">흡연자 vs 비흡연자</text>

      <g transform="translate(28 154)">
        <rect width="88" height="111" rx="18" fill="#F8F5FF"/>
        <rect x="104" width="88" height="111" rx="18" fill="#F8F5FF"/>
        <circle cx="44" cy="37" r="18" fill="#B7A9EC"/>
        <circle cx="148" cy="37" r="18" fill="#8E79E0"/>
        <text x="44" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#6E60A2">비흡연</text>
        <text x="148" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#58448F">흡연</text>
      </g>

      <text x="28" y="286" font-size="15" fill="#6B5D9B">BMI · 충치 · 중성지방 · 혈압</text>
      <text x="28" y="308" font-size="15" fill="#6B5D9B">비율 · 평균 · 중앙값 비교</text>
    </g>

    <!-- INTERPRET -->
    <g transform="translate(1274 180)">
      <rect width="250" height="324" rx="28" fill="#FFE8EF" stroke="#F8CCD8" stroke-width="2"/>
      <circle cx="42" cy="42" r="20" fill="#F083A5"/>
      <text x="42" y="49" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">5</text>
      <text x="28" y="94" font-size="28" font-weight="800" fill="#873A55">INTERPRET</text>
      <text x="28" y="125" font-size="16" font-weight="700" fill="#9B5B70">상관관계 + 한계</text>

      <g transform="translate(28 154)">
        <rect width="194" height="111" rx="18" fill="#FFF7FA"/>
        <circle cx="39" cy="43" r="15" fill="#F7B7CA"/>
        <circle cx="91" cy="61" r="15" fill="#EFA1B8"/>
        <circle cx="144" cy="35" r="15" fill="#E989A7"/>
        <line x1="52" y1="49" x2="78" y2="56" stroke="#C86E8A" stroke-width="4" stroke-linecap="round"/>
        <line x1="104" y1="55" x2="131" y2="41" stroke="#C86E8A" stroke-width="4" stroke-linecap="round"/>
      </g>

      <text x="28" y="286" font-size="15" fill="#9B5B70">관찰된 관계를 인과로 단정하지 않음</text>
      <text x="28" y="308" font-size="15" fill="#9B5B70">표본 · 변수 · 수집 한계 함께 기록</text>
    </g>
  </g>

  <g fill="#111827" opacity="0.82">
    <path d="M337 342 l16 -9 v18z"/>
    <path d="M637 342 l16 -9 v18z"/>
    <path d="M937 342 l16 -9 v18z"/>
    <path d="M1237 342 l16 -9 v18z"/>
  </g>

  <text x="72" y="566" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#64748B">분석의 목적은 예측 성능 경쟁이 아니라, 흡연 여부와 건강 지표 사이에서 관찰되는 패턴을 이해하고 시각적으로 설명하는 것입니다.</text>
</svg>