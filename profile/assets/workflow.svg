<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">Smoking health analysis workflow</title>
  <desc id="desc">Five-step workflow from dataset review to interpretation, laid out on a fixed alignment grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset="0.50" stop-color="#FBF8FF"/>
      <stop offset="1" stop-color="#FFF9F2"/>
    </linearGradient>
    <linearGradient id="rail" x1="195" y1="0" x2="1395" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69C9F3"/>
      <stop offset="0.25" stop-color="#F2B25A"/>
      <stop offset="0.50" stop-color="#5DC88C"/>
      <stop offset="0.75" stop-color="#9580E4"/>
      <stop offset="1" stop-color="#F083A5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="660" rx="34" fill="url(#bg)"/>
  <text x="72" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="40" font-weight="800" fill="#111827">ANALYSIS WORKFLOW</text>
  <text x="72" y="121" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" fill="#64748B">건강검진 데이터에서 흡연 관련 패턴을 읽어내는 실제 분석 흐름</text>

  <path d="M195 352H1395" stroke="#E3E8EF" stroke-width="10" stroke-linecap="round"/>
  <path d="M195 352H1395" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" opacity="0.84"/>
  <circle r="7" fill="#111827">
    <animateMotion dur="8s" repeatCount="indefinite" path="M195 352H1395"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g fill="#D8DEE8" opacity="0.20">
    <rect x="77" y="190" width="250" height="344" rx="30"/>
    <rect x="377" y="190" width="250" height="344" rx="30"/>
    <rect x="677" y="190" width="250" height="344" rx="30"/>
    <rect x="977" y="190" width="250" height="344" rx="30"/>
    <rect x="1277" y="190" width="250" height="344" rx="30"/>
  </g>

  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <g transform="translate(70 182)">
      <rect width="250" height="344" rx="30" fill="#DFF4FF" stroke="#B8E5F8" stroke-width="2"/>
      <circle cx="125" cy="48" r="23" fill="#66C6F0"/>
      <text x="125" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">1</text>
      <text x="125" y="104" text-anchor="middle" font-size="28" font-weight="800" fill="#164B61">DATA</text>
      <text x="125" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#326276">7,000 rows · 18 columns</text>
      <rect x="28" y="160" width="194" height="92" rx="18" fill="#FFFFFF" fill-opacity="0.84"/>
      <rect x="48" y="180" width="86" height="8" rx="4" fill="#7FCDEC"/>
      <rect x="48" y="201" width="142" height="7" rx="3.5" fill="#A8DBEF"/>
      <rect x="48" y="220" width="126" height="7" rx="3.5" fill="#A8DBEF"/>
      <text x="125" y="286" text-anchor="middle" font-size="14" fill="#416B7C">BMI · 혈압 · 중성지방</text>
      <text x="125" y="310" text-anchor="middle" font-size="14" fill="#416B7C">충치 · 혈당 · 지질 지표</text>
    </g>

    <g transform="translate(370 182)">
      <rect width="250" height="344" rx="30" fill="#FFF0D8" stroke="#F8D7A6" stroke-width="2"/>
      <circle cx="125" cy="48" r="23" fill="#F2B35D"/>
      <text x="125" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">2</text>
      <text x="125" y="104" text-anchor="middle" font-size="27" font-weight="800" fill="#704B1E">PREPARE</text>
      <text x="125" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#87653E">결측 처리 + 파생변수</text>
      <rect x="28" y="160" width="194" height="40" rx="20" fill="#FFF8EE"/>
      <text x="125" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#795327">BMI 구간 생성</text>
      <rect x="28" y="210" width="194" height="40" rx="20" fill="#FFF8EE"/>
      <text x="125" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#795327">연령대 구간 생성</text>
      <text x="125" y="286" text-anchor="middle" font-size="14" fill="#8A6940">결측 140건씩 확인</text>
      <text x="125" y="310" text-anchor="middle" font-size="14" fill="#8A6940">중앙값 · 최빈값 · 그룹 평균</text>
    </g>

    <g transform="translate(670 182)">
      <rect width="250" height="344" rx="30" fill="#E5F8EE" stroke="#CBECD9" stroke-width="2"/>
      <circle cx="125" cy="48" r="23" fill="#5DC88C"/>
      <text x="125" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">3</text>
      <text x="125" y="104" text-anchor="middle" font-size="27" font-weight="800" fill="#245B40">EXPLORE</text>
      <text x="125" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#467258">분포와 집단 차이 확인</text>
      <rect x="29" y="160" width="192" height="96" rx="18" fill="#F7FFFA"/>
      <line x1="48" y1="235" x2="202" y2="235" stroke="#B9DCC7" stroke-width="2"/>
      <rect x="57" y="207" width="24" height="28" rx="6" fill="#A8DDBA"/>
      <rect x="94" y="192" width="24" height="43" rx="6" fill="#7FCF9D"/>
      <rect x="131" y="176" width="24" height="59" rx="6" fill="#5EC88C"/>
      <rect x="168" y="199" width="24" height="36" rx="6" fill="#8FD5AA"/>
      <text x="125" y="286" text-anchor="middle" font-size="14" fill="#4B785D">단변량 · 이변량 · boxplot</text>
      <text x="125" y="310" text-anchor="middle" font-size="14" fill="#4B785D">연속형 · 범주형 시각화</text>
    </g>

    <g transform="translate(970 182)">
      <rect width="250" height="344" rx="30" fill="#EEE8FF" stroke="#DDD2FA" stroke-width="2"/>
      <circle cx="125" cy="48" r="23" fill="#9580E4"/>
      <text x="125" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">4</text>
      <text x="125" y="104" text-anchor="middle" font-size="27" font-weight="800" fill="#58448F">COMPARE</text>
      <text x="125" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5D9B">흡연자 vs 비흡연자</text>
      <rect x="29" y="160" width="88" height="96" rx="18" fill="#F8F5FF"/>
      <rect x="133" y="160" width="88" height="96" rx="18" fill="#F8F5FF"/>
      <circle cx="73" cy="194" r="17" fill="#B7A9EC"/>
      <circle cx="177" cy="194" r="17" fill="#8E79E0"/>
      <text x="73" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#6E60A2">비흡연</text>
      <text x="177" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#58448F">흡연</text>
      <text x="125" y="286" text-anchor="middle" font-size="14" fill="#6B5D9B">BMI · 충치 · 중성지방 · 혈압</text>
      <text x="125" y="310" text-anchor="middle" font-size="14" fill="#6B5D9B">비율 · 평균 · 중앙값 비교</text>
    </g>

    <g transform="translate(1270 182)">
      <rect width="250" height="344" rx="30" fill="#FFE8EF" stroke="#F8CCD8" stroke-width="2"/>
      <circle cx="125" cy="48" r="23" fill="#F083A5"/>
      <text x="125" y="55" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">5</text>
      <text x="125" y="104" text-anchor="middle" font-size="25" font-weight="800" fill="#873A55">INTERPRET</text>
      <text x="125" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#9B5B70">상관관계 + 한계</text>
      <rect x="28" y="160" width="194" height="96" rx="18" fill="#FFF7FA"/>
      <circle cx="67" cy="196" r="14" fill="#F7B7CA"/>
      <circle cx="119" cy="216" r="14" fill="#EFA1B8"/>
      <circle cx="171" cy="189" r="14" fill="#E989A7"/>
      <line x1="80" y1="202" x2="106" y2="211" stroke="#C86E8A" stroke-width="4" stroke-linecap="round"/>
      <line x1="132" y1="210" x2="158" y2="196" stroke="#C86E8A" stroke-width="4" stroke-linecap="round"/>
      <text x="125" y="286" text-anchor="middle" font-size="13.5" fill="#9B5B70">관찰 관계를 인과로 단정하지 않음</text>
      <text x="125" y="310" text-anchor="middle" font-size="13.5" fill="#9B5B70">표본 · 변수 · 수집 한계 함께 기록</text>
    </g>
  </g>

  <g fill="#111827" opacity="0.78">
    <path d="M353 352l-16 -9v18z"/>
    <path d="M653 352l-16 -9v18z"/>
    <path d="M953 352l-16 -9v18z"/>
    <path d="M1253 352l-16 -9v18z"/>
  </g>

  <text x="800" y="602" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#64748B">예측 성능 경쟁보다 흡연 여부와 건강 지표 사이에서 관찰되는 패턴을 이해하고 설명하는 데 초점을 둔 분석입니다.</text>
</svg>