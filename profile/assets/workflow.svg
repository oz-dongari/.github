<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc"> <title id="title">Smoking health analysis workflow</title> <desc id="desc">Data, preparation, exploration, comparison, interpretation.</desc> <defs> <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#FCFEFF"/><stop offset="0.5" stop-color="#FBF8FF"/><stop offset="1" stop-color="#FFF9F2"/></linearGradient> <linearGradient id="rail" x1="70" y1="0" x2="1530" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#69C9F3"/><stop offset="0.25" stop-color="#F2B25A"/><stop offset="0.5" stop-color="#5DC88C"/><stop offset="0.75" stop-color="#9580E4"/><stop offset="1" stop-color="#F083A5"/></linearGradient> <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#334155" flood-opacity="0.08"/></filter> </defs> <rect width="1600" height="660" rx="34" fill="url(#bg)"/> <text x="72" y="82" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#111827">ANALYSIS WORKFLOW</text> <text x="72" y="121" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="500" fill="#718096">데이터 확인 · 전처리 · 탐색 · 집단 비교 · 해석</text> <g stroke="url(#rail)" stroke-width="5" stroke-linecap="round" opacity="0.78"> <line x1="320" y1="350" x2="368" y2="350"/> <line x1="620" y1="350" x2="668" y2="350"/> <line x1="920" y1="350" x2="968" y2="350"/> <line x1="1220" y1="350" x2="1268" y2="350"/> </g> <g fill="#334155" opacity="0.88"> <path d="M350 340 L366 350 L350 360 Z"/> <path d="M650 340 L666 350 L650 360 Z"/> <path d="M950 340 L966 350 L950 360 Z"/> <path d="M1250 340 L1266 350 L1250 360 Z"/> </g> <g font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" filter="url(#shadow)"> <g transform="translate(70 182)"> <rect width="250" height="344" rx="28" fill="#DDF3FF" stroke="#A9DFF5" stroke-width="2"/> <circle cx="125" cy="49" r="23" fill="#5FC5EF"/> <text x="125" y="50" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#fff">1</text> <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#194E66">DATA</text> <text x="125" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#35667A">7,000 rows · 18 columns</text> <rect x="28" y="160" width="194" height="92" rx="18" fill="#FFFFFF" opacity="0.9"/> <rect x="48" y="180" width="86" height="8" rx="4" fill="#7DCBEA"/> <rect x="48" y="201" width="143" height="7" rx="3.5" fill="#A7DAED"/> <rect x="48" y="222" width="126" height="7" rx="3.5" fill="#A7DAED"/> <text x="125" y="291" text-anchor="middle" font-size="14.5" fill="#4A7080">BMI · 혈압 · 중성지방</text> <text x="125" y="315" text-anchor="middle" font-size="14.5" fill="#4A7080">충치 · 혈당 · 지질 지표</text> </g> <g transform="translate(370 182)"> <rect width="250" height="344" rx="28" fill="#FFF0D9" stroke="#F4CB8A" stroke-width="2"/> <circle cx="125" cy="49" r="23" fill="#F2B25A"/> <text x="125" y="50" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#fff">2</text> <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#765022">PREPARE</text> <text x="125" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#8C6840">결측 처리 + 파생변수</text> <rect x="28" y="160" width="194" height="40" rx="20" fill="#FFF9F0"/> <rect x="28" y="211" width="194" height="40" rx="20" fill="#FFF9F0"/> <text x="125" y="181" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#7B5528">BMI 구간 생성</text> <text x="125" y="232" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#7B5528">연령대 구간 생성</text> <text x="125" y="291" text-anchor="middle" font-size="14.5" fill="#8B6C47">변수별 결측 140건</text> <text x="125" y="315" text-anchor="middle" font-size="14.5" fill="#8B6C47">중앙값 · 최빈값 · 그룹 평균</text> </g> <g transform="translate(670 182)"> <rect width="250" height="344" rx="28" fill="#E5F7EE" stroke="#BFE6CF" stroke-width="2"/> <circle cx="125" cy="49" r="23" fill="#59C58A"/> <text x="125" y="50" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#fff">3</text> <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#245C40">EXPLORE</text> <text x="125" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#47745A">분포 · 집단 차이</text> <rect x="28" y="160" width="194" height="106" rx="18" fill="#F8FFFB"/> <line x1="48" y1="239" x2="202" y2="239" stroke="#B8DCC6" stroke-width="2"/> <rect x="55" y="207" width="24" height="32" rx="6" fill="#9AD7AF"/> <rect x="94" y="189" width="24" height="50" rx="6" fill="#78CC98"/> <rect x="133" y="172" width="24" height="67" rx="6" fill="#58C689"/> <rect x="172" y="199" width="24" height="40" rx="6" fill="#89D2A4"/> <text x="125" y="291" text-anchor="middle" font-size="14.5" fill="#4C7A5E">단변량 · 이변량 · boxplot</text> <text x="125" y="315" text-anchor="middle" font-size="14.5" fill="#4C7A5E">연속형 · 범주형 시각화</text> </g> <g transform="translate(970 182)"> <rect width="250" height="344" rx="28" fill="#EEE8FF" stroke="#D5C8FA" stroke-width="2"/> <circle cx="125" cy="49" r="23" fill="#927DE1"/> <text x="125" y="50" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#fff">4</text> <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#594590">COMPARE</text> <text x="125" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#6E60A0">흡연자 vs 비흡연자</text> <rect x="28" y="160" width="88" height="106" rx="18" fill="#FAF8FF"/> <rect x="134" y="160" width="88" height="106" rx="18" fill="#FAF8FF"/> <circle cx="72" cy="197" r="18" fill="#B6A8EB"/> <circle cx="178" cy="197" r="18" fill="#8E79E0"/> <text x="72" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7062A5">비흡연</text> <text x="178" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#594590">흡연</text> <text x="125" y="291" text-anchor="middle" font-size="14" fill="#6E60A0">BMI · 충치 · 중성지방 · 혈압</text> <text x="125" y="315" text-anchor="middle" font-size="14.5" fill="#6E60A0">비율 · 평균 · 중앙값 비교</text> </g> <g transform="translate(1270 182)"> <rect width="250" height="344" rx="28" fill="#FFE7EF" stroke="#F5C5D4" stroke-width="2"/> <circle cx="125" cy="49" r="23" fill="#EF7FA2"/> <text x="125" y="50" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#fff">5</text> <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#8A3B57">INTERPRET</text> <text x="125" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#9C5E73">상관관계 + 한계</text> <rect x="28" y="160" width="194" height="106" rx="18" fill="#FFF8FA"/> <circle cx="66" cy="200" r="14" fill="#F4ABC1"/> <circle cx="125" cy="221" r="14" fill="#EB91AE"/> <circle cx="184" cy="192" r="14" fill="#E6799C"/> <line x1="78" y1="205" x2="112" y2="216" stroke="#C96E8B" stroke-width="4" stroke-linecap="round"/> <line x1="138" y1="215" x2="172" y2="198" stroke="#C96E8B" stroke-width="4" stroke-linecap="round"/> <text x="125" y="291" text-anchor="middle" font-size="14" fill="#9C5E73">관찰 관계 ≠ 인과</text> <text x="125" y="315" text-anchor="middle" font-size="14" fill="#9C5E73">표본 · 변수 · 수집 한계</text> </g> </g> <text x="800" y="610" text-anchor="middle" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="500" fill="#718096">분석 초점 · 흡연 여부와 건강 지표의 관찰 패턴 · 인과 추론 제외</text> </svg>