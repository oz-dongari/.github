<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Key smoking and health findings</title>
  <desc id="desc">Precisely aligned visual summary of triglycerides, cavity prevalence, and smoking share by BMI group.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#FAF8FF"/></linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECF9FF"/><stop offset="1" stop-color="#DDF3FD"/></linearGradient>
    <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF7E9"/><stop offset="1" stop-color="#FFEBD2"/></linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3FAEF"/><stop offset="1" stop-color="#E5F4DD"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#334155" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#bg)"/>
  <text x="80" y="82" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#111827">KEY FINDINGS</text>
  <text x="80" y="124" dominant-baseline="middle" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="21" fill="#6B7280">최종 Notebook의 실제 출력값을 기준으로 정리한 대표 관찰 결과</text>

  <g filter="url(#shadow)">
    <g transform="translate(80 180)" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
      <rect width="453" height="450" rx="30" fill="url(#blueCard)" stroke="#B8E5F7" stroke-width="2"/>
      <text x="40" y="52" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2" fill="#39718A">TRIGLYCERIDES · MEAN</text>
      <text x="40" y="96" dominant-baseline="middle" font-size="25" font-weight="800" fill="#17384A">평균 중성지방</text>
      <line x1="40" y1="132" x2="413" y2="132" stroke="#B6DDEB" stroke-width="2"/>
      <text x="40" y="178" dominant-baseline="middle" font-size="18" font-weight="700" fill="#4F9FC3">비흡연</text>
      <text x="413" y="178" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#183649">113.45</text>
      <rect x="40" y="206" width="285" height="16" rx="8" fill="#A6DDF2"/>
      <text x="40" y="270" dominant-baseline="middle" font-size="18" font-weight="700" fill="#E47D39">흡연</text>
      <text x="413" y="270" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#111827">150.40</text>
      <rect x="40" y="298" width="373" height="16" rx="8" fill="#F5A560"/>
      <rect x="40" y="360" width="373" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.70"/>
      <text x="226.5" y="388" dominant-baseline="middle" text-anchor="middle" font-size="18" font-weight="700" fill="#375E72">평균값 차이  <tspan font-family="Arial, sans-serif" font-weight="800">+36.95</tspan></text>
    </g>

    <g transform="translate(573 180)" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
      <rect width="453" height="450" rx="30" fill="url(#orangeCard)" stroke="#FFD2A0" stroke-width="2"/>
      <text x="40" y="52" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2" fill="#94602D">CAVITY PREVALENCE</text>
      <text x="40" y="96" dominant-baseline="middle" font-size="25" font-weight="800" fill="#6B451E">충치 있음 비율</text>
      <line x1="40" y1="132" x2="413" y2="132" stroke="#F2D1AB" stroke-width="2"/>
      <text x="40" y="178" dominant-baseline="middle" font-size="18" font-weight="700" fill="#4F9FC3">비흡연</text>
      <text x="413" y="178" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#503416">19.6%</text>
      <rect x="40" y="206" width="260" height="16" rx="8" fill="#A6DDF2"/>
      <text x="40" y="270" dominant-baseline="middle" font-size="18" font-weight="700" fill="#E47D39">흡연</text>
      <text x="413" y="270" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#111827">28.2%</text>
      <rect x="40" y="298" width="373" height="16" rx="8" fill="#F5A560"/>
      <rect x="40" y="360" width="373" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.70"/>
      <text x="226.5" y="388" dominant-baseline="middle" text-anchor="middle" font-size="18" font-weight="700" fill="#795026">충치 비율 차이  <tspan font-family="Arial, sans-serif" font-weight="800">+8.6%p</tspan></text>
    </g>

    <g transform="translate(1066 180)" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
      <rect width="454" height="450" rx="30" fill="url(#greenCard)" stroke="#C8E5B9" stroke-width="2"/>
      <text x="40" y="52" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2" fill="#4C7444">SMOKING SHARE BY BMI</text>
      <text x="40" y="96" dominant-baseline="middle" font-size="25" font-weight="800" fill="#31552C">BMI 구간별 흡연자 비율</text>
      <line x1="40" y1="132" x2="414" y2="132" stroke="#C9DFC0" stroke-width="2"/>
      <text x="40" y="168" dominant-baseline="middle" font-size="17" font-weight="700" fill="#496744">정상</text>
      <text x="414" y="168" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#34532E">30.6%</text>
      <rect x="40" y="190" width="248" height="14" rx="7" fill="#AAD6A0"/>
      <text x="40" y="226" dominant-baseline="middle" font-size="17" font-weight="700" fill="#496744">비만전단계</text>
      <text x="414" y="226" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#34532E">39.6%</text>
      <rect x="40" y="248" width="321" height="14" rx="7" fill="#8CCB7D"/>
      <text x="40" y="284" dominant-baseline="middle" font-size="17" font-weight="700" fill="#496744">1단계 비만</text>
      <text x="414" y="284" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#34532E">41.8%</text>
      <rect x="40" y="306" width="339" height="14" rx="7" fill="#6FBE62"/>
      <text x="40" y="342" dominant-baseline="middle" font-size="17" font-weight="700" fill="#496744">2단계 비만</text>
      <text x="414" y="342" dominant-baseline="middle" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">46.0%</text>
      <rect x="40" y="364" width="374" height="14" rx="7" fill="#F0A35B"/>
      <rect x="40" y="390" width="374" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.70"/>
      <text x="227" y="408" dominant-baseline="middle" text-anchor="middle" font-size="17" font-weight="700" fill="#4C7444">흡연자 비율 변화  <tspan font-family="Arial, sans-serif" font-weight="800">+15.4%p</tspan></text>
    </g>
  </g>

  <text x="80" y="684" dominant-baseline="middle" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="17" fill="#6B7280">※ BMI 3단계 비만 구간은 표본 41명으로 작아 단순 추세 해석에 주의가 필요합니다.</text>
</svg>