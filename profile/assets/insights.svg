<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Key smoking and health findings</title>
  <desc id="desc">Three cards compare triglycerides, cavity prevalence, and BMI-related smoking proportions.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1200" height="310" rx="28" fill="#fffdf9"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#111827">KEY FINDINGS</text>
  <text x="60" y="79" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Final notebook · descriptive group comparison</text>

  <g font-family="Arial, sans-serif" filter="url(#s)">
    <rect x="60" y="105" width="330" height="150" rx="24" fill="#eef9fe" stroke="#b9e5f7"/>
    <text x="88" y="137" font-size="14" font-weight="700" fill="#39718a">TRIGLYCERIDES · MEAN</text>
    <text x="88" y="187" font-size="34" font-weight="800" fill="#111827">150.40</text>
    <text x="220" y="187" font-size="18" font-weight="700" fill="#f28a45">smoker</text>
    <text x="88" y="222" font-size="25" font-weight="800" fill="#111827">113.45</text>
    <text x="190" y="222" font-size="16" font-weight="700" fill="#4f9fc3">non-smoker</text>

    <rect x="435" y="105" width="330" height="150" rx="24" fill="#fff5e7" stroke="#ffd5a4"/>
    <text x="463" y="137" font-size="14" font-weight="700" fill="#94602d">CAVITY PREVALENCE</text>
    <text x="463" y="191" font-size="38" font-weight="800" fill="#111827">28.2%</text>
    <text x="599" y="191" font-size="18" font-weight="700" fill="#f28a45">smoker</text>
    <text x="463" y="226" font-size="24" font-weight="800" fill="#111827">19.6%</text>
    <text x="562" y="226" font-size="16" font-weight="700" fill="#4f9fc3">non-smoker</text>

    <rect x="810" y="105" width="330" height="150" rx="24" fill="#f2f8ed" stroke="#cce8bf"/>
    <text x="838" y="137" font-size="14" font-weight="700" fill="#4c7444">SMOKING SHARE BY BMI</text>
    <text x="838" y="185" font-size="31" font-weight="800" fill="#111827">30.6% → 46.0%</text>
    <text x="838" y="219" font-size="15" fill="#4b5563">normal → obesity class 2</text>
    <path d="M850 238 C910 230 946 212 988 216 C1034 220 1072 186 1110 170" fill="none" stroke="#ef9a4d" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#ef9a4d"><animateMotion dur="3.8s" repeatCount="indefinite" path="M850 238 C910 230 946 212 988 216 C1034 220 1072 186 1110 170"/></circle>
  </g>
</svg>