<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Key smoking and health findings</title>
  <desc id="desc">Aligned visual summary of triglycerides, cavity prevalence, and smoking share by BMI group.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FAF8FF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECF9FF"/>
      <stop offset="1" stop-color="#DDF3FD"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E9"/>
      <stop offset="1" stop-color="#FFEBD2"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FAEF"/>
      <stop offset="1" stop-color="#E5F4DD"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#bg)"/>

  <text x="80" y="86" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="42" font-weight="800" fill="#111827">KEY FINDINGS</text>
  <text x="80" y="126" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" fill="#6B7280">최종 Notebook의 실제 출력값을 기준으로 정리한 대표 관찰 결과</text>

  <g>
    <rect x="80" y="180" width="453" height="450" rx="30" fill="url(#blueCard)" stroke="#B8E5F7" stroke-width="2"/>
    <text x="120" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" letter-spacing="1.3" fill="#39718A">TRIGLYCERIDES · MEAN</text>
    <text x="120" y="276" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="800" fill="#17384A">평균 중성지방</text>
    <line x1="120" y1="312" x2="493" y2="312" stroke="#B6DDEB" stroke-width="2"/>
    <text x="120" y="365" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#4F9FC3">비흡연</text>
    <text x="493" y="365" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="38" font-weight="800" fill="#183649">113.45</text>
    <rect x="120" y="386" width="285" height="16" rx="8" fill="#A6DDF2"/>
    <text x="120" y="457" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#E47D39">흡연</text>
    <text x="493" y="457" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="46" font-weight="800" fill="#111827">150.40</text>
    <rect x="120" y="478" width="373" height="16" rx="8" fill="#F5A560"/>
    <rect x="120" y="540" width="373" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.68"/>
    <text x="306.5" y="575" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#375E72">평균값 차이 +36.95</text>

    <rect x="573" y="180" width="453" height="450" rx="30" fill="url(#orangeCard)" stroke="#FFD2A0" stroke-width="2"/>
    <text x="613" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" letter-spacing="1.3" fill="#94602D">CAVITY PREVALENCE</text>
    <text x="613" y="276" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="800" fill="#6B451E">충치 있음 비율</text>
    <line x1="613" y1="312" x2="986" y2="312" stroke="#F2D1AB" stroke-width="2"/>
    <text x="613" y="365" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#4F9FC3">비흡연</text>
    <text x="986" y="365" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="38" font-weight="800" fill="#503416">19.6%</text>
    <rect x="613" y="386" width="260" height="16" rx="8" fill="#A6DDF2"/>
    <text x="613" y="457" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#E47D39">흡연</text>
    <text x="986" y="457" text-anchor="end" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="46" font-weight="800" fill="#111827">28.2%</text>
    <rect x="613" y="478" width="373" height="16" rx="8" fill="#F5A560"/>
    <rect x="613" y="540" width="373" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.68"/>
    <text x="799.5" y="575" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#795026">흡연자 집단이 8.6%p 높게 관찰됨</text>

    <rect x="1066" y="180" width="454" height="450" rx="30" fill="url(#greenCard)" stroke="#C8E5B9" stroke-width="2"/>
    <text x="1106" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" letter-spacing="1.3" fill="#4C7444">SMOKING SHARE BY BMI</text>
    <text x="1106" y="276" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="800" fill="#31552C">BMI 구간별 흡연자 비율</text>
    <line x1="1106" y1="312" x2="1480" y2="312" stroke="#C9DFC0" stroke-width="2"/>
    <g font-family="Arial, 'Noto Sans KR', sans-serif">
      <text x="1106" y="357" font-size="17" font-weight="700" fill="#496744">정상</text>
      <text x="1480" y="357" text-anchor="end" font-size="24" font-weight="800" fill="#34532E">30.6%</text>
      <rect x="1106" y="373" width="248" height="14" rx="7" fill="#AAD6A0"/>
      <text x="1106" y="421" font-size="17" font-weight="700" fill="#496744">비만전단계</text>
      <text x="1480" y="421" text-anchor="end" font-size="24" font-weight="800" fill="#34532E">39.6%</text>
      <rect x="1106" y="437" width="321" height="14" rx="7" fill="#8CCB7D"/>
      <text x="1106" y="485" font-size="17" font-weight="700" fill="#496744">1단계 비만</text>
      <text x="1480" y="485" text-anchor="end" font-size="24" font-weight="800" fill="#34532E">41.8%</text>
      <rect x="1106" y="501" width="339" height="14" rx="7" fill="#6FBE62"/>
      <text x="1106" y="549" font-size="17" font-weight="700" fill="#496744">2단계 비만</text>
      <text x="1480" y="549" text-anchor="end" font-size="30" font-weight="800" fill="#111827">46.0%</text>
      <rect x="1106" y="565" width="374" height="14" rx="7" fill="#F0A35B"/>
    </g>
  </g>

  <text x="80" y="684" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#6B7280">※ BMI 3단계 비만 구간은 표본 41명으로 작아 단순 추세 해석에 주의가 필요합니다.</text>
</svg>