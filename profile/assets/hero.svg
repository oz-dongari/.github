<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">OZ Healthcare Data Lab</title>
  <desc id="desc">Pastel healthcare data analysis hero inspired by the team presentation, showing smoking and health metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f8f3ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b2b2b" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="30" fill="url(#bg)"/>

  <!-- pastel doodles -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M75 75 C100 42 145 48 156 78 C172 66 203 72 207 98 C210 124 185 136 158 133 L101 133 C72 133 56 110 64 91 Z" fill="#cceeff" stroke="#b6e3f4" stroke-width="4"/>
    <path d="M1032 60 C1057 48 1082 58 1088 80 C1111 64 1146 76 1147 106 C1148 132 1124 145 1097 143 L1043 143 C1017 142 1003 121 1009 99 C1012 86 1020 72 1032 60 Z" fill="#dff3df" stroke="#c9e8c7" stroke-width="4"/>
    <path d="M87 320 q26 -30 52 0 q-26 34 -52 0" stroke="#d9c2ee" stroke-width="8"/>
    <path d="M1060 320 q25 -30 50 0 q-25 34 -50 0" stroke="#f7b8c8" stroke-width="8"/>
    <path d="M190 54 l10 -18 l10 18 l18 10 l-18 10 l-10 18 l-10 -18 l-18 -10z" fill="#ffe6a3" stroke="#f5d584" stroke-width="3"/>
    <path d="M975 350 l10 -18 l10 18 l18 10 l-18 10 l-10 18 l-10 -18 l-18 -10z" fill="#ffd3bb" stroke="#f4b894" stroke-width="3"/>
    <path d="M52 210 C75 195 95 202 102 220 C110 238 97 259 76 259 C55 259 42 240 46 224" stroke="#b9e2d5" stroke-width="6"/>
    <path d="M1144 205 C1125 188 1104 195 1097 214 C1090 234 1104 253 1125 253 C1146 253 1158 236 1155 219" stroke="#ffd19f" stroke-width="6"/>
  </g>

  <!-- subtle moving dots -->
  <g opacity="0.8">
    <circle r="5" fill="#79c7eb"><animateMotion dur="8s" repeatCount="indefinite" path="M60 388 C260 332 325 402 500 365 C695 325 850 390 1130 340"/></circle>
    <circle r="4" fill="#ffad65"><animateMotion dur="10s" repeatCount="indefinite" path="M1130 110 C920 150 860 78 705 120 C525 170 352 84 70 145"/></circle>
  </g>

  <!-- main card -->
  <rect x="154" y="92" width="892" height="264" rx="34" fill="#f6ede3" filter="url(#shadow)"/>
  <rect x="190" y="126" width="54" height="54" rx="10" fill="#111111"/>
  <text x="217" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">oz.</text>

  <text x="270" y="154" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6b7280">HEALTHCARE DATA MINI PROJECT</text>
  <text x="190" y="220" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#111827">SMOKING × HEALTH DATA</text>
  <text x="190" y="263" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#374151">흡연 여부 데이터 분석을 통한 건강 인사이트 도출</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="190" y="292" width="152" height="38" rx="19" fill="#c9ebfb"/><text x="266" y="317" text-anchor="middle" fill="#24556d">7,000 records</text>
    <rect x="354" y="292" width="132" height="38" rx="19" fill="#ffe0bd"/><text x="420" y="317" text-anchor="middle" fill="#7a4a19">18 variables</text>
    <rect x="498" y="292" width="169" height="38" rx="19" fill="#dff3df"/><text x="582" y="317" text-anchor="middle" fill="#315d3a">EDA · visualization</text>
    <rect x="679" y="292" width="177" height="38" rx="19" fill="#e7dcf6"/><text x="767" y="317" text-anchor="middle" fill="#5b4676">correlation analysis</text>
  </g>

  <!-- health symbols -->
  <g transform="translate(895 173)">
    <path d="M0 0 C-25 -22 -62 -3 -62 28 C-62 69 0 100 0 100 C0 100 62 69 62 28 C62 -3 25 -22 0 0 Z" fill="#ff8f9c" opacity="0.88"/>
    <path d="M-25 48 h18 l8 -20 l13 41 l10 -21 h25" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M75 408 H1125" stroke="#111827" stroke-width="3"/>
  <path d="M1035 408 h90 l-20 -16 h-70z" fill="#111827"/>
</svg>